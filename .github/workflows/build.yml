name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: LSFG-Android-Application

      - name: Checkout lsfg-vk-android (must be sibling directory for CMake)
        uses: actions/checkout@v4
        with:
          repository: FrankBarretta/lsfg-vk-android
          ref: release
          path: lsfg-vk-android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Build debug APK
        working-directory: LSFG-Android-Application
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build release APK
        working-directory: LSFG-Android-Application
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lsfg-android-debug-arm64
          path: LSFG-Android-Application/app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: lsfg-android-release-arm64
          path: LSFG-Android-Application/app/build/outputs/apk/release/*.apk
